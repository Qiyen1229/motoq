[project]
name = "motoq"
version = "0.1.0"
description = "MotoQ — 私有汽機車管理網站後端"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
    "pillow>=12.3.0",
    "pillow-heif>=1.8.1",
    "apscheduler>=3.11.3",
    "weasyprint>=70.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
